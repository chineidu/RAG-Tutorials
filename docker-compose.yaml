services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    profiles: ["retriever"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    container_name: redis
    image: docker.io/redis:8.2-bookworm
    command: redis-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - valkey-data2:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_FORMATS=json,html
      - SEARXNG_LOGGING_LEVEL=ERROR # Reduce logging verbosity

    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
        # Reduce log level
        tag: "searxng"

networks:
  searxng:

volumes:
  qdrant_storage:
  valkey-data2:
  searxng-data: