[project]
name = "rag-tutorials"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "google-search-results>=2.4.2",
    "langchain-community>=0.3.27",
    "langchain-core>=0.3.72",
    "langchain-google-vertexai>=2.0.27",
    "langchain-ollama>=0.3.6",
    "langchain-openai>=0.3.28",
    "langchain-qdrant>=0.2.0",
    "langchain-tavily>=0.2.11",
    "langgraph>=0.6.5",
    "langsmith>=0.4.8",
    "llama-index-embeddings-ollama>=0.6.0",
    "llama-index-embeddings-together>=0.3.0",
    "llama-index-llms-openrouter>=0.3.2",
    "llama-index-llms-together>=0.3.2",
    "llama-index-vector-stores-qdrant>=0.6.1",
    "llama-index>=0.12.52",
    "matplotlib>=3.10.3",
    "pandas>=2.2.3",
    "polars>=1.31.0",
    "pydantic-settings>=2.10.1",
    "qdrant-client>=1.15.0",
    "rich>=14.1.0",
    "scikit-image>=0.25.2",
    "streamlit>=1.48.0",
    "tiktoken>=0.9.0",
    "together>=1.5.21",
    "uvicorn>=0.35.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "jupyter>=1.1.1",
    "nb-black-formatter>=1.0.1",
    "pyrefly>=0.27.0",
    "pytest>=8.4.1",
    "requests-mock>=1.12.1",
    "ruff>=0.12.5",
]

[tool.pyrefly]
project-includes = ["src"]
project-excludes = ["**/.[!/.]*", "**/*venv/**"]
ignore-missing-source = true

