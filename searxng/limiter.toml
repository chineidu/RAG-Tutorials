[botdetection.ip_limit]
# Enable rate limiting
filter_link_local = false
link_token = false

[botdetection.ip_lists]
pass_searxng_org = false
pass_ip = []
block_ip = []

[botdetection]
# trusted_proxies expects a list of IP addresses/ranges of trusted proxies
# For Docker/local development, you can use an empty list or specify your proxy IPs
# ["172.16.0.0/12"] for Docker
trusted_proxies = ["172.16.0.0/12"]
