use_default_settings: true

general:
  debug: false
  instance_name: "Local SearXNG"
  contact_url: false
  enable_stats: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

outgoing:
  request_timeout: 15.0  # Increase from default 3.0

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "mysecretkey" # Change this!
  base_url: false
  image_proxy: false
  http_protocol_version: "1.0"
  method: "GET"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-XSS-Protection: 1; mode=block
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  static_use_hash: false
  default_locale: ""
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  cache_url: https://web.archive.org/web/
  search_on_category_select: true
  hotkeys: default

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: true

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

enabled_plugins:
  - "Hash plugin"
  - "Search on category select"
  - "Self Information"
  - "Tracker URL remover"

disabled_plugins:
  - "Open Access DOI rewrite"
  - "Vim-like hotkeys"
